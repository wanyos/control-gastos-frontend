<!-- @dsCard group="Type" viewport="700x200" name="Display · Schibsted Grotesk" subtitle="Page titles & hero metrics — --font-display, tight tracking" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-display); }
  .big { font-size: 48px; font-weight: 800; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.05; }
  .mid { font-size: 28px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; margin-top: 6px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="big">Resumen financiero</div>
  <div class="mid">Tu dinero, bajo control</div>
  <div class="meta">Schibsted Grotesk · 800 / 700 · tracking −0.02em</div>
</body>
</html>
