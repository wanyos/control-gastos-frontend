<!-- @dsCard group="Brand" viewport="700x210" name="Marca en uso" subtitle="Hero balance treatment — the signature composition" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--neutral-950); }
  .card { background: linear-gradient(160deg, #0E7C55 0%, #075C3F 100%); border-radius: var(--radius-xl); padding: 22px 24px; color: #fff; max-width: 360px; box-shadow: var(--shadow-lg); }
  .ov { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .bal { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em; }
  .bal .c { color: rgba(255,255,255,.6); font-weight: 500; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .pill { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: var(--radius-pill); background: rgba(255,255,255,.14); white-space: nowrap; }
  .pill.up { color: #B8FBDD; }
</style>
</head>
<body>
  <div class="card">
    <div class="ov">Saldo total · 5 cuentas</div>
    <div class="bal">12.480,55 <span class="c">€</span></div>
    <div class="row">
      <span class="pill up">▲ 4,2% este mes</span>
      <span class="pill">+528,40 €</span>
    </div>
  </div>
</body>
</html>
