<!-- @dsCard group="Colors" viewport="700x150" name="Neutros · Slate" subtitle="Cool slate ink scale — surfaces, text, borders" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs); border: 1px solid rgba(11,17,22,.08); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 7px; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--neutral-0)"></div><div class="name">0</div><div class="hex">FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="name">50</div><div class="hex">F7F9FB</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="name">100</div><div class="hex">F0F3F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-200)"></div><div class="name">200</div><div class="hex">E3E8ED</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-300)"></div><div class="name">300</div><div class="hex">CDD5DD</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-400)"></div><div class="name">400</div><div class="hex">9BA6B2</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-500)"></div><div class="name">500</div><div class="hex">6B7785</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-700)"></div><div class="name">700</div><div class="hex">38434F</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-900)"></div><div class="name">900</div><div class="hex">141B22</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-950)"></div><div class="name">950</div><div class="hex">0B1116</div></div>
  </div>
</body>
</html>
