<!-- @dsCard group="Spacing" viewport="700x180" name="Escala de espaciado" subtitle="4px base grid — space-1…16" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display: flex; align-items: flex-end; gap: 18px; }
  .u { text-align: center; }
  .bar { background: var(--green-200); border-radius: var(--radius-xs); width: 26px; }
  .b1{height:4px}.b2{height:8px}.b3{height:12px}.b4{height:16px}.b6{height:24px}.b8{height:32px}.b12{height:48px}.b16{height:64px}
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="u"><div class="bar b1"></div><div class="n">1</div><div class="px">4</div></div>
  <div class="u"><div class="bar b2"></div><div class="n">2</div><div class="px">8</div></div>
  <div class="u"><div class="bar b3"></div><div class="n">3</div><div class="px">12</div></div>
  <div class="u"><div class="bar b4"></div><div class="n">4</div><div class="px">16</div></div>
  <div class="u"><div class="bar b6"></div><div class="n">6</div><div class="px">24</div></div>
  <div class="u"><div class="bar b8"></div><div class="n">8</div><div class="px">32</div></div>
  <div class="u"><div class="bar b12"></div><div class="n">12</div><div class="px">48</div></div>
  <div class="u"><div class="bar b16"></div><div class="n">16</div><div class="px">64</div></div>
</body>
</html>
