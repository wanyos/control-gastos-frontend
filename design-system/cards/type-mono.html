<!-- @dsCard group="Type" viewport="700x190" name="Cifras · JetBrains Mono" subtitle="Tabular figures for money & metrics — --font-mono, tnum" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .stack { font-family: var(--font-mono); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
  .big { font-size: 40px; font-weight: 600; color: var(--text-strong); }
  .big .cur { color: var(--text-muted); font-weight: 500; }
  .col { display: flex; gap: 40px; margin-top: 14px; }
  .col span { display: block; font-size: 16px; font-weight: 500; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 14px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="big">12.480,55 <span class="cur">€</span></div>
    <div class="col">
      <div style="color:var(--positive)"><span>+3.120,00</span></div>
      <div style="color:var(--negative)"><span>−1.844,20</span></div>
      <div style="color:var(--text-muted)"><span>0,00</span></div>
    </div>
    <div class="meta">JetBrains Mono · 600 / 500 · tabular-nums · alinea en columnas</div>
  </div>
</body>
</html>
