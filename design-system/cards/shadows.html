<!-- @dsCard group="Spacing" viewport="700x190" name="Sombras" subtitle="Soft layered elevation — xs → xl + brand glow" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px 24px; background: var(--surface-app); display: flex; gap: 26px; align-items: center; }
  .u { text-align: center; }
  .box { width: 80px; height: 64px; background: var(--surface-card); border-radius: var(--radius-lg); }
  .n { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-brand);background:var(--green-600)"></div><div class="n">brand</div></div>
</body>
</html>
