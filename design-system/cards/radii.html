<!-- @dsCard group="Spacing" viewport="700x170" name="Radios de borde" subtitle="xs 4 · sm 6 · md 10 · lg 14 · xl 20 · pill" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display: flex; gap: 22px; align-items: flex-start; }
  .u { text-align: center; }
  .box { width: 72px; height: 72px; background: var(--green-100); border: 1.5px solid var(--green-400); }
  .n { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 9px; }
</style>
</head>
<body>
  <div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="n">xs · 4</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm · 6</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md · 10</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg · 14</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl · 20</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="n">pill</div></div>
</body>
</html>
