<!-- @dsCard group="Colors" viewport="700x150" name="Paleta de gráficos" subtitle="8 categorical hues for charts & categories — --chart-1…8" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 56px; border-radius: var(--radius-md); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 7px; }
  .cat { font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--chart-1)"></div><div class="name">chart-1</div><div class="cat">ingresos</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-2)"></div><div class="name">chart-2</div><div class="cat">ahorros</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-3)"></div><div class="name">chart-3</div><div class="cat">inversión</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-4)"></div><div class="name">chart-4</div><div class="cat">vivienda</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-5)"></div><div class="name">chart-5</div><div class="cat">ocio</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-6)"></div><div class="name">chart-6</div><div class="cat">comida</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-7)"></div><div class="name">chart-7</div><div class="cat">suscrip.</div></div>
    <div class="sw"><div class="chip" style="background:var(--chart-8)"></div><div class="name">chart-8</div><div class="cat">transporte</div></div>
  </div>
</body>
</html>
