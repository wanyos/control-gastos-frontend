<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; padding: 22px; background: var(--surface-card); } .ico { width: 16px; height: 16px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Switch, Checkbox } = window.ControlCuentasDesignSystem_7df875;
const I = ({ n }) => <i data-lucide={n} className="ico"></i>;
function Demo() {
  const [on, setOn] = React.useState(true);
  const [chk, setChk] = React.useState(true);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, alignItems: 'start' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <Button variant="primary" iconLeft={<I n="plus" />}>Nuevo</Button>
          <Button variant="secondary">Cancelar</Button>
          <Button variant="ghost" size="sm">Ver todo</Button>
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <Button variant="danger" size="sm">Eliminar</Button>
          <Button variant="primary" size="sm" loading>Guardando</Button>
          <IconButton label="Ajustes" variant="secondary"><I n="settings" /></IconButton>
          <IconButton label="Filtros" variant="ghost"><I n="sliders-horizontal" /></IconButton>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 4 }}>
          <Switch checked={on} onChange={setOn} label="Redondeo automático" />
          <Checkbox checked={chk} onChange={setChk} label="Incluir transferencias" />
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <Input label="Importe" prefix="€" placeholder="0,00" defaultValue="240,00" />
        <Select label="Cuenta" options={['BBVA Nómina','Sabadell Ahorro','Revolut']} defaultValue="BBVA Nómina" />
        <Input label="IBAN" error="El IBAN no es válido" defaultValue="ES12 3456" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
</body>
</html>
